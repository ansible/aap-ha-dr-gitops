apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-irsa-repair
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-irsa-repair
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["external-secrets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-irsa-repair
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "3"
subjects:
  - kind: ServiceAccount
    name: eso-irsa-repair
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-irsa-repair
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: eso-irsa-annotation-repair
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  schedule: "0 0,12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: eso-irsa-repair
          restartPolicy: OnFailure
          containers:
            - name: repair
              image: registry.redhat.io/openshift4/ose-cli:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: ESO_ROLE_ARN
                  value: MUST_BE_SET_BY_OVERLAY
              command:
                - /bin/sh
                - -ec
                - |
                  current="$(oc get serviceaccount external-secrets -n external-secrets -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}' 2>/dev/null || true)"
                  if [ "$current" = "$ESO_ROLE_ARN" ]; then
                    echo "ESO IRSA annotation is correct"
                    exit 0
                  fi
                  echo "Restoring ESO IRSA annotation"
                  oc annotate serviceaccount external-secrets -n external-secrets \
                    "eks.amazonaws.com/role-arn=${ESO_ROLE_ARN}" --overwrite
