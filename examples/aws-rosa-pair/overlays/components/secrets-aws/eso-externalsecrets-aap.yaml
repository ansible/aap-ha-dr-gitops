# ExternalSecrets: AWS Secrets Manager → Kubernetes Secrets (example/aap/shared/* only).
# Namespaces: openshift-gitops (Argo repo key), aap-workloads (proxy token, pull secret,
# admin credentials), aap (platform secrets). Populate AWS before sync.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-aap-hadr
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: cluster-cross-account-secret-store
    kind: ClusterSecretStore
  target:
    name: repo-aap-hadr
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
  dataFrom:
    - extract:
        key: example/aap/shared/argocd-deploy-key
---
