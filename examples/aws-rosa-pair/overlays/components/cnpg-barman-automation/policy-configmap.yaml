apiVersion: v1
kind: ConfigMap
metadata:
  name: cnpg-wal-barman-policy
data:
  policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "CNPGWalBucketAccess",
          "Effect": "Allow",
          "Principal": {"AWS": ["arn:aws:iam:::user/hub-realm-system-user"]},
          "Action": ["s3:ListBucket", "s3:GetBucketLocation"],
          "Resource": ["arn:aws:s3:::cnpg-wal"]
        },
        {
          "Sid": "CNPGWalObjectAccess",
          "Effect": "Allow",
          "Principal": {"AWS": ["arn:aws:iam:::user/hub-realm-system-user"]},
          "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload"],
          "Resource": ["arn:aws:s3:::cnpg-wal/example-a/*", "arn:aws:s3:::cnpg-wal/example-b/*"]
        }
      ]
    }
