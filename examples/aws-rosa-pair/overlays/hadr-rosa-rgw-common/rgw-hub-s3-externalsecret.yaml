---
# Hub S3 credentials from AWS Secrets Manager.
# Uses realm system user keys + fixed bucket name — same on both clusters.
# Replaces the PostSync job that mapped OBC credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hub-rgw-s3-credentials
  namespace: aap
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-cross-account-secret-store
    kind: ClusterSecretStore
  target:
    name: hub-rgw-s3-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: example/aap/shared/hub-rgw-s3-credentials
