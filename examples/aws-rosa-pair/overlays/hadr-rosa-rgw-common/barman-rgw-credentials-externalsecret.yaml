---
# Barman S3 credentials for WAL archiving to local Ceph RGW.
# Reuses the same RGW user as Hub — maps key names to barman's format.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: barman-rgw-credentials
  namespace: aap
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-cross-account-secret-store
    kind: ClusterSecretStore
  target:
    name: barman-rgw-credentials
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID # gitleaks:allow -- ExternalSecret key name
      remoteRef:
        key: example/aap/shared/hub-rgw-s3-credentials
        property: s3-access-key-id
    - secretKey: ACCESS_SECRET_KEY # gitleaks:allow -- ExternalSecret key name
      remoteRef:
        key: example/aap/shared/hub-rgw-s3-credentials
        property: s3-secret-access-key
