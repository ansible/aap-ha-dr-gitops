---
# Pre-create hub-realm-keys with clean alphanumeric keys from AWS SM.
# Rook uses these keys for the realm system user instead of generating
# random keys with special characters that break S3 auth signatures.
# Must be created BEFORE the CephObjectRealm CR (sync-wave 0 < realm wave 1).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hub-realm-keys
  namespace: openshift-storage
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-cross-account-secret-store
    kind: ClusterSecretStore
  target:
    name: hub-realm-keys
    creationPolicy: Owner
    template:
      type: kubernetes.io/rook
  dataFrom:
    - extract:
        key: example/aap/shared/hub-realm-keys
