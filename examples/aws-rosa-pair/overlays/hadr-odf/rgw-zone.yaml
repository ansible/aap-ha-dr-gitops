---
# Ceph RGW Zone + ObjectStore template, parameterized by the ODF ApplicationSet.
apiVersion: ceph.rook.io/v1
kind: CephObjectZone
metadata:
  name: zone-template
  namespace: openshift-storage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  zoneGroup: hub-zonegroup
  metadataPool:
    replicated:
      size: 3
  dataPool:
    replicated:
      size: 3
  customEndpoints:
    - https://example.invalid
---
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: hub-objectstore
  namespace: openshift-storage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  zone:
    name: zone-template
  metadataPool:
    replicated:
      size: 3
  dataPool:
    replicated:
      size: 3
  gateway:
    port: 80
    instances: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
---
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: hub-s3-user
  namespace: openshift-storage
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  store: hub-objectstore
  displayName: "Hub S3 User"
  capabilities:
    bucket: "*"
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: hub-rgw-obc
  namespace: aap
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  bucketName: automation-hub-content
  storageClassName: hub-objectstore-ceph-rgw
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: cnpg-wal-obc
  namespace: aap
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  bucketName: cnpg-wal
  storageClassName: hub-objectstore-ceph-rgw
