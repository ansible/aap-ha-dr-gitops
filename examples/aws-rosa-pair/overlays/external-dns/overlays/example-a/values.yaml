# Enable through external-dns-enable only after the ownership handoff.
replicaCount: 1
fullnameOverride: external-dns-example-a
serviceAccount:
  name: external-dns-example-a
txtOwnerId: external-dns-example-a
domainFilters:
- cluster.example.com
env:
- name: AWS_REGION
  value: us-east-1
- name: AWS_ROLE_ARN
  value: arn:aws:iam::000000000000:role/example-eso-secrets-reader
- name: AWS_WEB_IDENTITY_TOKEN_FILE
  value: /var/run/secrets/aws/token
- name: AWS_EC2_METADATA_DISABLED
  value: 'true'
