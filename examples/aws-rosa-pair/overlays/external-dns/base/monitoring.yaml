# Platform kube-state-metrics detects an enabled controller that cannot start.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-external-dns
  namespace: openshift-monitoring
spec:
  groups:
    - name: cnpg-external-dns
      rules:
        - alert: CNPGExternalDNSUnavailable
          expr: |
            (kube_deployment_status_replicas_available{namespace="external-dns",deployment=~"external-dns-hadr-.*"} < 1)
            and on(namespace, deployment)
            (kube_deployment_spec_replicas{namespace="external-dns",deployment=~"external-dns-hadr-.*"} > 0)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: CNPG ExternalDNS controller is unavailable
            description: Check the Helm controller pod and its ServiceAccount permissions before relying on automatic replication DNS updates.
---
# User workload monitoring scrapes the chart's ServiceMonitor on port 7979.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-external-dns-sync
  namespace: external-dns
spec:
  groups:
    - name: cnpg-external-dns-sync
      rules:
        - alert: CNPGExternalDNSSyncStalled
          expr: time() - external_dns_controller_last_sync_timestamp_seconds{namespace="external-dns"} > 120
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: CNPG ExternalDNS has stopped reconciling successfully
            description: Inspect ExternalDNS logs for STS, Route53 permission, ownership or Kubernetes watch errors.
