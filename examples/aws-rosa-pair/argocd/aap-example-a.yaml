apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aap-hadr-example-a
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/ansible-automation-platform/aap-ha-dr-gitops/
    targetRevision: main
    path: examples/aws-rosa-pair/bootstrap/example-a
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
