---
# Pause automation on the fixed Applications generated by the cluster's
# ApplicationSets.

- name: Pause ArgoCD child app {{ item }} on {{ argocd_context }}
  aap.hadr_ops.argocd_application_update:
    application_name: "{{ item }}"
    namespace: "{{ argocd_namespace }}"
    context: "{{ argocd_context }}"
    pause_automation: true
  loop: "{{ argocd_application_names }}"

- name: Log ArgoCD paused
  ansible.builtin.debug:
    msg: "ArgoCD automation paused on {{ argocd_context }} (apps={{ argocd_application_names | join(', ') }})"
