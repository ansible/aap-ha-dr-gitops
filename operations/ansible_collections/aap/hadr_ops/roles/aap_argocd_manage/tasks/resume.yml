---
# Resume the fixed Applications generated by the per-cluster ApplicationSets.
# Pair-changing callers pass the expected pair/environment/role so a stale
# inventory handoff fails closed before automation is re-enabled.

- name: Validate pair-state assertion inputs
  ansible.builtin.assert:
    that:
      - argocd_pair_id | length > 0
      - argocd_environment_id | length > 0
      - argocd_expected_role in ['primary', 'replica']
    fail_msg: >-
      Pair-aware resume requires argocd_pair_id, argocd_environment_id, and
      argocd_expected_role (primary or replica).
  when: argocd_expected_role | default('') | length > 0

- name: Read pair-generated CNPG and platform Applications on {{ argocd_context }}
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ item }}"
    namespace: "{{ argocd_namespace }}"
    context: "{{ argocd_context }}"
  loop: "{{ argocd_pair_role_application_names }}"
  register: _argocd_pair_role_applications
  when: argocd_expected_role | default('') | length > 0

- name: Assert Applications match the approved pair state before resuming
  ansible.builtin.assert:
    that:
      - item.resources | default([]) | length == 1
      - _labels.get('aap.hadr.redhat.com/pair', '') == argocd_pair_id
      - _labels.get('aap.hadr.redhat.com/environment', '') == argocd_environment_id
      - _labels.get('aap.hadr.redhat.com/desired-role', '') == argocd_expected_role
    fail_msg: >-
      {{ item.item }} on {{ argocd_context }} is not generated for pair
      {{ argocd_pair_id }}, environment {{ argocd_environment_id }}, role
      {{ argocd_expected_role }}. Update and merge the pair record, wait for
      its ApplicationSet output to reconcile, then retry. Automation remains
      paused until this check passes.
  vars:
    _application: "{{ item.resources | default([]) | first | default({}) }}"
    _labels: "{{ (_application.metadata | default({})).labels | default({}) }}"
  loop: "{{ _argocd_pair_role_applications.results | default([]) }}"
  when: argocd_expected_role | default('') | length > 0

- name: Resume fixed ApplicationSet Applications on {{ argocd_context }}
  aap.hadr_ops.argocd_application_update:
    application_name: "{{ item }}"
    namespace: "{{ argocd_namespace }}"
    context: "{{ argocd_context }}"
    resume_automation: true
    trigger_sync: "{{ argocd_trigger_sync | default(false) }}"
  loop: "{{ argocd_application_names }}"

- name: Log ArgoCD resumed
  ansible.builtin.debug:
    msg: >-
      Fixed Applications resumed on {{ argocd_context }}
      (apps={{ argocd_application_names | join(', ') }})
      {{ '(pair=' + argocd_pair_id + ', environment=' + argocd_environment_id +
         ', role=' + argocd_expected_role + ')' if argocd_expected_role | default('') | length > 0 else '' }}
      {{ '(sync triggered)' if argocd_trigger_sync | default(false) | bool else '' }}
