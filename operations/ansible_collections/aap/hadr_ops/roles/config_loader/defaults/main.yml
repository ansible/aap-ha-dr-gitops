---
# config_loader — Single source of truth for all collection variables.
#
# This role defines every variable used across the aap.hadr_ops collection.
# Environment-specific values default to "" (empty) and MUST be provided
# via -e @clusters.yml or playbook vars. Non-environment-specific values
# have sensible defaults that work for standard AAP deployments.
#
# Import this role at the start of any playbook:
#   - name: Load and validate configuration
#     import_role:
#       name: aap.hadr_ops.config_loader

# ===========================================================================
# ENVIRONMENT-SPECIFIC — must be provided via -e @clusters.yml
# ===========================================================================

# Cluster topology (typically loaded from cluster_sets[cluster_set])
cluster_a_context: ""
cluster_b_context: ""
cluster_a_kubeconfig: ""
cluster_b_kubeconfig: ""
site_id_a: ""
site_id_b: ""

# Cluster set selector and topology data
cluster_set: "01"
# cluster_sets: {}  # Entire topology dict — provided via -e @clusters.yml
pair_state_reconciled: false

# ApplicationSet pair and environment identities are loaded from cluster inventory.
hadr_pair_id: ""
hadr_environment_id_a: ""
hadr_environment_id_b: ""

# ===========================================================================
# AAP RESOURCE NAMES — sensible defaults for standard AAP deployments
# ===========================================================================

aap_namespace: "aap"
cluster_name: "aap-postgres"
aap_name: "aap"
argocd_parent_app_name: ""   # Set per cluster-set (e.g. aap-hadr-rosa-a); empty = not using App of Apps
argocd_application_names:    # Fixed Application names generated by per-cluster ApplicationSets
  - aap-cnpg
  - aap-eso
  - aap-odf
  - aap-platform

# ===========================================================================
# OPENSHIFT PLATFORM CONSTANTS
# ===========================================================================

argocd_namespace: "openshift-gitops"
csi_drivers_namespace: "openshift-cluster-csi-drivers"
aap_operator_subscription: "ansible-automation-platform-operator"

# ===========================================================================
# GITOPS SETTINGS
# ===========================================================================

# ===========================================================================
# DERIVED NAMES (computed from aap_name)
# ===========================================================================
# These are set in tasks/main.yml after validation. Listed here for reference.
#
# aap_child_crs:
#   controller: "{{ aap_name }}-controller"
#   hub: "{{ aap_name }}-hub"
#   eda: "{{ aap_name }}-eda"
#
# aap_key_deployments:
#   - "{{ aap_name }}-controller-task"
#   - "{{ aap_name }}-controller-web"
#   - "{{ aap_name }}-gateway"
#   - "{{ aap_name }}-hub-api"
#   - "{{ aap_name }}-eda-api"
#
# oauth2_secret_name: "{{ aap_name }}-gateway-oauth2-token-secret"
#
# _site_to_context: { site_id_a: cluster_a_context, site_id_b: cluster_b_context }

# ===========================================================================
# OPERATIONAL SETTINGS
# ===========================================================================

switchover_log_dir: "/tmp"

# Force a full re-bootstrap even if WAL timelines match
force_reclone: false

# Timing — CNPG restore/rebuild
cnpg_restore_health_timeout: 5400
cnpg_restore_poll_interval: 10
cnpg_pod_ready_timeout: 300
cnpg_pod_ready_poll_interval: 10
replication_verify_timeout: 300
replication_verify_poll_interval: 10
streaming_validation_timeout: 120
streaming_validation_poll_interval: 10

# Timing — CNPG switchover
token_wait_timeout: 150
cnpg_promotion_wait: 10
cnpg_readiness_timeout: 300
cnpg_readiness_poll_interval: 10

# Timing — AAP platform lifecycle
aap_idle_verify_retries: 6
aap_idle_verify_delay: 5
aap_reconciliation_retries: 12
aap_reconciliation_delay: 10
aap_readiness_timeout: 600
aap_readiness_poll_interval: 15

# Timing — health checks
health_check_retries: 30
health_check_delay: 10

# Timing — backup/restore
backup_wait: true
backup_wait_timeout: 3600
backup_poll_interval: 10
wal_archiver_max_failed: 0
wal_archiver_max_lag_seconds: 300
