---
# AAP-75811: Delete stale gateway OAuth2 secret after switchover
#
# The gateway operator stores an OAuth2 token in a K8s secret. After failover,
# the database only recognises the token created by the other cluster's operator.
# Deleting the secret lets the operator regenerate a valid one on startup.

- name: "AAP-75811: Delete stale OAuth2 secret on {{ workaround_context }}"
  kubernetes.core.k8s:
    api_version: v1
    kind: Secret
    name: "{{ oauth2_secret_name }}"
    namespace: "{{ aap_namespace }}"
    context: "{{ workaround_context }}"
    state: absent
  register: _oauth2_delete
  ignore_errors: true

- name: Set workaround result
  ansible.builtin.set_fact:
    workaround_result:
      context: "{{ workaround_context }}"
      oauth2_secret:
        action: "{{ 'deleted' if (_oauth2_delete.changed | default(false)) else 'absent' }}"
        secret_name: "{{ oauth2_secret_name }}"
        error: "{{ _oauth2_delete.msg | default('') if _oauth2_delete is failed else '' }}"

- name: Log OAuth2 workaround
  ansible.builtin.debug:
    msg: >-
      AAP-75811 OAuth2 secret on {{ workaround_context }}:
      {{ workaround_result.oauth2_secret.action }}
      {{ '(error: ' + workaround_result.oauth2_secret.error + ')' if workaround_result.oauth2_secret.error else '' }}
