---
# Fix CHK-14: ArgoCD degraded — trigger sync or wait if syncing.
#
# Input: _check_key, _check_name, _check_detail
# Output: _fix_result, _fix_detail

- name: "FIX {{ _check_name }}: Check if transient sync"
  ansible.builtin.set_fact:
    _chk14_is_syncing: "{{ 'syncing' in (_check_detail | lower) or 'sync in progress' in (_check_detail | lower) }}"

- name: "FIX {{ _check_name }}: Wait for sync to complete"
  when: _chk14_is_syncing | bool
  block:
    - name: "FIX {{ _check_name }}: Pause for sync"
      ansible.builtin.pause:
        seconds: 30
        prompt: "ArgoCD sync in progress — waiting 30s for completion..."

    - name: "FIX {{ _check_name }}: Record sync wait"
      ansible.builtin.set_fact:
        _fix_result: "pending"
        _fix_detail: "ArgoCD sync in progress — waited for completion (transient)"

- name: "FIX {{ _check_name }}: Find all ArgoCD apps on cluster A"
  when:
    - not (_chk14_is_syncing | bool)
    - _chk01_a_reachable | default(false) | bool
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: "{{ argocd_namespace | default('openshift-gitops') }}"
    context: "{{ cluster_a_context }}"
  register: _argocd_apps_a
  failed_when: false

- name: "FIX {{ _check_name }}: Trigger hard refresh on degraded apps (cluster A)"
  when:
    - not (_chk14_is_syncing | bool)
    - _chk01_a_reachable | default(false) | bool
    - item.status.health.status | default('') == 'Degraded'
  kubernetes.core.k8s:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: "{{ argocd_namespace | default('openshift-gitops') }}"
    context: "{{ cluster_a_context }}"
    name: "{{ item.metadata.name }}"
    definition:
      metadata:
        annotations:
          argocd.argoproj.io/refresh: "hard"
    merge_type: merge
  loop: "{{ _argocd_apps_a.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  failed_when: false

- name: "FIX {{ _check_name }}: Find all ArgoCD apps on cluster B"
  when:
    - not (_chk14_is_syncing | bool)
    - _chk01_b_reachable | default(false) | bool
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: "{{ argocd_namespace | default('openshift-gitops') }}"
    context: "{{ cluster_b_context }}"
  register: _argocd_apps_b
  failed_when: false

- name: "FIX {{ _check_name }}: Trigger hard refresh on degraded apps (cluster B)"
  when:
    - not (_chk14_is_syncing | bool)
    - _chk01_b_reachable | default(false) | bool
    - item.status.health.status | default('') == 'Degraded'
  kubernetes.core.k8s:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: "{{ argocd_namespace | default('openshift-gitops') }}"
    context: "{{ cluster_b_context }}"
    name: "{{ item.metadata.name }}"
    definition:
      metadata:
        annotations:
          argocd.argoproj.io/refresh: "hard"
    merge_type: merge
  loop: "{{ _argocd_apps_b.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  failed_when: false

- name: "FIX {{ _check_name }}: Record result"
  when: not (_chk14_is_syncing | bool)
  ansible.builtin.set_fact:
    _fix_result: "pending"
    _fix_detail: "Triggered ArgoCD hard refresh on all degraded apps"
