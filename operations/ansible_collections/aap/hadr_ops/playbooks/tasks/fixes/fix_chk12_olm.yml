---
# Fix CHK-12: OLM/CSV deadlock — delete stuck CSV so OLM recreates it.
# Ports logic from scripts/fix-olm-deadlock.sh.
# Finds CSVs by name pattern (aap-operator) rather than label selector,
# since labels may not be present on all clusters.
#
# Input: _check_key, _check_name, _check_detail
# Output: _fix_result, _fix_detail

- name: "FIX {{ _check_name }}: Find all CSVs on cluster A"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_a_context }}"
  register: _csvs_a
  when: _chk01_a_reachable | default(false) | bool
  failed_when: false

- name: "FIX {{ _check_name }}: Delete stuck CSVs on cluster A"
  kubernetes.core.k8s:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    name: "{{ item.metadata.name }}"
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_a_context }}"
    state: absent
  loop: "{{ _csvs_a.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when:
    - _chk01_a_reachable | default(false) | bool
    - "'aap-operator' in item.metadata.name"
    - item.status.phase | default('') in ['Replacing', 'Failed']
  failed_when: false

- name: "FIX {{ _check_name }}: Find all CSVs on cluster B"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_b_context }}"
  register: _csvs_b
  when: _chk01_b_reachable | default(false) | bool
  failed_when: false

- name: "FIX {{ _check_name }}: Delete stuck CSVs on cluster B"
  kubernetes.core.k8s:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    name: "{{ item.metadata.name }}"
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_b_context }}"
    state: absent
  loop: "{{ _csvs_b.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when:
    - _chk01_b_reachable | default(false) | bool
    - "'aap-operator' in item.metadata.name"
    - item.status.phase | default('') in ['Replacing', 'Failed']
  failed_when: false

- name: "FIX {{ _check_name }}: Approve pending InstallPlans on cluster A"
  block:
    - name: "FIX {{ _check_name }}: Find InstallPlans on cluster A"
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        namespace: "{{ aap_namespace | default('aap') }}"
        context: "{{ cluster_a_context }}"
      register: _ips_a
      failed_when: false

    - name: "FIX {{ _check_name }}: Approve unapproved InstallPlans on cluster A"
      kubernetes.core.k8s:
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        name: "{{ item.metadata.name }}"
        namespace: "{{ aap_namespace | default('aap') }}"
        context: "{{ cluster_a_context }}"
        definition:
          spec:
            approved: true
        merge_type: merge
      loop: "{{ _ips_a.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: not (item.spec.approved | default(true) | bool)
      failed_when: false
  when: _chk01_a_reachable | default(false) | bool

- name: "FIX {{ _check_name }}: Approve pending InstallPlans on cluster B"
  block:
    - name: "FIX {{ _check_name }}: Find InstallPlans on cluster B"
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        namespace: "{{ aap_namespace | default('aap') }}"
        context: "{{ cluster_b_context }}"
      register: _ips_b
      failed_when: false

    - name: "FIX {{ _check_name }}: Approve unapproved InstallPlans on cluster B"
      kubernetes.core.k8s:
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        name: "{{ item.metadata.name }}"
        namespace: "{{ aap_namespace | default('aap') }}"
        context: "{{ cluster_b_context }}"
        definition:
          spec:
            approved: true
        merge_type: merge
      loop: "{{ _ips_b.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: not (item.spec.approved | default(true) | bool)
      failed_when: false
  when: _chk01_b_reachable | default(false) | bool

- name: "FIX {{ _check_name }}: Wait for OLM to recreate CSV"
  ansible.builtin.pause:
    seconds: 60
    prompt: "Waiting 60s for OLM to recreate CSV after deletion..."

- name: "FIX {{ _check_name }}: Verify CSV healthy on cluster A"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_a_context }}"
  register: _csv_verify_a
  when: _chk01_a_reachable | default(false) | bool
  until: >-
    (_csv_verify_a.resources | default([])
     | selectattr('metadata.name', 'match', 'aap-operator')
     | selectattr('status.phase', 'eq', 'Succeeded')
     | list | length > 0)
  retries: 12
  delay: 10
  failed_when: false

- name: "FIX {{ _check_name }}: Verify CSV healthy on cluster B"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_b_context }}"
  register: _csv_verify_b
  when: _chk01_b_reachable | default(false) | bool
  until: >-
    (_csv_verify_b.resources | default([])
     | selectattr('metadata.name', 'match', 'aap-operator')
     | selectattr('status.phase', 'eq', 'Succeeded')
     | list | length > 0)
  retries: 12
  delay: 10
  failed_when: false

- name: "FIX {{ _check_name }}: Record result"
  vars:
    _deleted_a: "{{ _csvs_a.resources | default([]) | selectattr('status.phase', 'in', ['Replacing', 'Failed']) | list | length }}"
    _deleted_b: "{{ _csvs_b.resources | default([]) | selectattr('status.phase', 'in', ['Replacing', 'Failed']) | list | length }}"
  ansible.builtin.set_fact:
    _fix_result: "pending"
    _fix_detail: "Deleted {{ _deleted_a | int + _deleted_b | int }} stuck CSV(s), approved pending InstallPlans, waited for OLM recovery"
