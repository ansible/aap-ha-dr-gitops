---
# Fix CHK-13: Clear stale promotionToken from CNPG Cluster CR.
#
# Input: _check_key, _check_name, _check_detail
# Output: _fix_result, _fix_detail

- name: "FIX {{ _check_name }}: Get CNPG Cluster CR on cluster A"
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_a_context }}"
  register: _cnpg_clusters_a
  when: _chk01_a_reachable | default(false) | bool
  failed_when: false

- name: "FIX {{ _check_name }}: Clear promotionToken on cluster A"
  kubernetes.core.k8s:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ item.metadata.name }}"
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_a_context }}"
    definition:
      spec:
        replica:
          promotionToken: null
    merge_type: merge
  loop: "{{ _cnpg_clusters_a.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when:
    - _chk01_a_reachable | default(false) | bool
    - item.spec.replica.promotionToken | default('') | length > 0
  failed_when: false

- name: "FIX {{ _check_name }}: Get CNPG Cluster CR on cluster B"
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_b_context }}"
  register: _cnpg_clusters_b
  when: _chk01_b_reachable | default(false) | bool
  failed_when: false

- name: "FIX {{ _check_name }}: Clear promotionToken on cluster B"
  kubernetes.core.k8s:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ item.metadata.name }}"
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_b_context }}"
    definition:
      spec:
        replica:
          promotionToken: null
    merge_type: merge
  loop: "{{ _cnpg_clusters_b.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when:
    - _chk01_b_reachable | default(false) | bool
    - item.spec.replica.promotionToken | default('') | length > 0
  failed_when: false

- name: "FIX {{ _check_name }}: Record result"
  ansible.builtin.set_fact:
    _fix_result: "pending"
    _fix_detail: "Cleared stale promotionToken from CNPG Cluster CR"
