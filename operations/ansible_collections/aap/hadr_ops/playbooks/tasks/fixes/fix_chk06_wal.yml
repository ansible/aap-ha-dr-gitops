---
# Fix CHK-06: WAL timeline divergence — re-bootstrap replica.
#
# Input: _check_key, _check_name, _check_detail
# Output: _fix_result, _fix_detail

- name: "FIX {{ _check_name }}: Restore replication (re-bootstraps diverged replica)"
  ansible.builtin.include_role:
    name: aap.hadr_ops.cnpg_restore_replication
  vars:
    target_primary: "{{ _wal_primary_site | default(site_id_a) }}"
    confirm: "{{ autofix_confirm | default('no') }}"

- name: "FIX {{ _check_name }}: Record result"
  ansible.builtin.set_fact:
    _fix_result: "pending"
    _fix_detail: "Restored replication to fix WAL timeline divergence"
