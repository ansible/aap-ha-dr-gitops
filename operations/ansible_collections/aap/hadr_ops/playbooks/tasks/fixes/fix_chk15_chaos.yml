---
# Fix CHK-15: Delete leftover krkn chaos test NetworkPolicy.
# Name matches the artifact checked in check_platform.yml.
#
# Input: _check_key, _check_name, _check_detail
# Output: _fix_result, _fix_detail

- name: "FIX {{ _check_name }}: Delete chaos NetworkPolicy on cluster A"
  kubernetes.core.k8s:
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    name: krkn-dr-region-outage
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_a_context }}"
    state: absent
  when: _chk01_a_reachable | default(false) | bool
  failed_when: false

- name: "FIX {{ _check_name }}: Delete chaos NetworkPolicy on cluster B"
  kubernetes.core.k8s:
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    name: krkn-dr-region-outage
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_b_context }}"
    state: absent
  when: _chk01_b_reachable | default(false) | bool
  failed_when: false

- name: "FIX {{ _check_name }}: Record result"
  ansible.builtin.set_fact:
    _fix_result: "pending"
    _fix_detail: "Deleted krkn-dr-region-outage NetworkPolicy"
