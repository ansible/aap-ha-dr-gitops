---
# Fix CHK-11: AAP Topology — patch idle_deployment=false on active site (AAP-77947).
#
# Input: _check_key, _check_name, _check_detail
# Output: _fix_result, _fix_detail

- name: "FIX {{ _check_name }}: Check if AAP-77947 idle_deployment issue"
  ansible.builtin.set_fact:
    _chk11_is_77947: "{{ 'AAP-77947' in _check_detail or 'idle_deployment' in _check_detail }}"

- name: "FIX {{ _check_name }}: Skip — not AAP-77947 issue"
  when: not (_chk11_is_77947 | bool)
  ansible.builtin.set_fact:
    _fix_result: "skipped"
    _fix_detail: "Topology issue is not AAP-77947 idle_deployment — requires manual investigation"

- name: "FIX {{ _check_name }}: Patch child CRs on cluster A"
  when:
    - _chk11_is_77947 | bool
    - _chk01_a_reachable | default(false) | bool
  kubernetes.core.k8s:
    api_version: automationcontroller.ansible.com/v1beta1
    kind: AutomationController
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_a_context }}"
    name: "{{ aap_child_crs.controller }}"
    definition:
      spec:
        idle_deployment: false
    merge_type: merge
  failed_when: false
  register: _patch_a

- name: "FIX {{ _check_name }}: Patch child CRs on cluster B"
  when:
    - _chk11_is_77947 | bool
    - _chk01_b_reachable | default(false) | bool
  kubernetes.core.k8s:
    api_version: automationcontroller.ansible.com/v1beta1
    kind: AutomationController
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_b_context }}"
    name: "{{ aap_child_crs.controller }}"
    definition:
      spec:
        idle_deployment: false
    merge_type: merge
  failed_when: false
  register: _patch_b

- name: "FIX {{ _check_name }}: Record result"
  when: _chk11_is_77947 | bool
  ansible.builtin.set_fact:
    _fix_result: "pending"
    _fix_detail: "Patched child CRs to set idle_deployment=false on reachable clusters"
