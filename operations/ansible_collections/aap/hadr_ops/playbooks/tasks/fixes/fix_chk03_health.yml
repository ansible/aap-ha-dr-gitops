---
# Fix CHK-03: Cluster health — delete CrashLoopBackOff/Error/Unknown CNPG pods.
# CNPG operator will recreate healthy pods.
# Only targets pods in Failed, Unknown phase, or CrashLoopBackOff waiting state.
#
# Input: _check_key, _check_name, _check_detail
# Output: _fix_result, _fix_detail

- name: "FIX {{ _check_name }}: Find CNPG pods on cluster A"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_a_context }}"
    label_selectors:
      - "cnpg.io/cluster={{ cluster_name }}"
  register: _cnpg_pods_a
  when: _chk01_a_reachable | default(false) | bool
  failed_when: false

- name: "FIX {{ _check_name }}: Build list of unhealthy pods on cluster A"
  ansible.builtin.set_fact:
    _bad_pods_a: >-
      {% set pods = [] %}
      {% for pod in _cnpg_pods_a.resources | default([]) %}
      {% if pod.status.phase | default('') in ['Failed', 'Unknown'] %}
      {% if pods.append(pod.metadata.name) %}{% endif %}
      {% else %}
      {% for cs in pod.status.containerStatuses | default([]) %}
      {% if cs.state.waiting is defined and cs.state.waiting.reason | default('') in ['CrashLoopBackOff', 'Error', 'ImagePullBackOff'] %}
      {% if pods.append(pod.metadata.name) %}{% endif %}
      {% endif %}
      {% endfor %}
      {% endif %}
      {% endfor %}
      {{ pods | unique }}
  when: _chk01_a_reachable | default(false) | bool

- name: "FIX {{ _check_name }}: Delete unhealthy pods on cluster A"
  kubernetes.core.k8s:
    api_version: v1
    kind: Pod
    name: "{{ item }}"
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_a_context }}"
    state: absent
  loop: "{{ _bad_pods_a | default([]) }}"
  when: _chk01_a_reachable | default(false) | bool
  failed_when: false

- name: "FIX {{ _check_name }}: Find CNPG pods on cluster B"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_b_context }}"
    label_selectors:
      - "cnpg.io/cluster={{ cluster_name }}"
  register: _cnpg_pods_b
  when: _chk01_b_reachable | default(false) | bool
  failed_when: false

- name: "FIX {{ _check_name }}: Build list of unhealthy pods on cluster B"
  ansible.builtin.set_fact:
    _bad_pods_b: >-
      {% set pods = [] %}
      {% for pod in _cnpg_pods_b.resources | default([]) %}
      {% if pod.status.phase | default('') in ['Failed', 'Unknown'] %}
      {% if pods.append(pod.metadata.name) %}{% endif %}
      {% else %}
      {% for cs in pod.status.containerStatuses | default([]) %}
      {% if cs.state.waiting is defined and cs.state.waiting.reason | default('') in ['CrashLoopBackOff', 'Error', 'ImagePullBackOff'] %}
      {% if pods.append(pod.metadata.name) %}{% endif %}
      {% endif %}
      {% endfor %}
      {% endif %}
      {% endfor %}
      {{ pods | unique }}
  when: _chk01_b_reachable | default(false) | bool

- name: "FIX {{ _check_name }}: Delete unhealthy pods on cluster B"
  kubernetes.core.k8s:
    api_version: v1
    kind: Pod
    name: "{{ item }}"
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_b_context }}"
    state: absent
  loop: "{{ _bad_pods_b | default([]) }}"
  when: _chk01_b_reachable | default(false) | bool
  failed_when: false

- name: "FIX {{ _check_name }}: Record result"
  ansible.builtin.set_fact:
    _fix_result: "pending"
    _fix_detail: >-
      Deleted {{ (_bad_pods_a | default([]) | length) + (_bad_pods_b | default([]) | length) }}
      unhealthy CNPG pod(s) (CrashLoopBackOff/Error/Unknown only)
