---
# Fix CHK-04: Failover loop — wait for CNPG operator to settle.
# Pauses explicitly here, then autofix_single_attempt.yml waits again
# before the recheck. Total wait = this pause + autofix_retry_delay.
#
# Input: _check_key, _check_name, _check_detail
# Output: _fix_result, _fix_detail

- name: "FIX {{ _check_name }}: Wait for failover loop to settle"
  ansible.builtin.pause:
    seconds: 60
    prompt: "Failover loop detected — waiting 60s for CNPG operator to stabilize..."

- name: "FIX {{ _check_name }}: Check CNPG cluster phase"
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ cluster_name }}"
    namespace: "{{ aap_namespace | default('aap') }}"
    context: "{{ cluster_a_context }}"
  register: _cnpg_phase_check
  failed_when: false

- name: "FIX {{ _check_name }}: Record result"
  ansible.builtin.set_fact:
    _fix_result: "pending"
    _fix_detail: >-
      Waited 60s for failover loop to settle.
      CNPG phase: {{ _cnpg_phase_check.resources[0].status.phase | default('unknown') }}
