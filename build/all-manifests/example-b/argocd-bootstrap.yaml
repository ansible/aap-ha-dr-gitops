apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aap-odf
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  ignoreApplicationDifferences:
  - jsonPointers:
    - /spec/syncPolicy/automated
  template:
    metadata:
      name: aap-odf
      namespace: openshift-gitops
      labels:
        aap.hadr.redhat.com/pair: '{{ .pair_id }}'
        aap.hadr.redhat.com/environment: '{{ .environment_id }}'
        aap.hadr.redhat.com/rgw-role: '{{ .rgw_role }}'
      annotations:
        argocd.argoproj.io/sync-options: Prune=false
        argocd.argoproj.io/compare-options: IgnoreExtraneous
    spec:
      project: default
      source:
        repoURL: https://github.com/ansible-automation-platform/aap-ha-dr-gitops/
        targetRevision: main
        path: '{{ if eq .rgw_role "primary" }}layers/odf-primary{{ else }}layers/odf-replica{{ end }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: aap
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - SkipDryRunOnMissingResource=true
        - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      ignoreDifferences:
      - group: '*'
        kind: '*'
        jsonPointers:
        - /status
  templatePatch: |
    spec:
      source:
        kustomize:
          patches:
            - target:
                group: ceph.rook.io
                version: v1
                kind: CephObjectZone
                name: zone-template
              patch: |-
                - op: replace
                  path: /metadata/name
                  value: {{ .rgw_zone_name | toJson }}
                - op: replace
                  path: /spec/customEndpoints/0
                  value: {{ .workloads.odf.endpoint | toJson }}
            - target:
                group: ceph.rook.io
                version: v1
                kind: CephObjectStore
                name: hub-objectstore
              patch: |-
                - op: replace
                  path: /spec/zone/name
                  value: {{ .rgw_zone_name | toJson }}
            - target:
                group: ocs.openshift.io
                version: v1
                kind: StorageCluster
                name: ocs-storagecluster
              patch: |-
                - op: replace
                  path: /spec/storageDeviceSets/0/dataPVCTemplate/spec/storageClassName
                  value: {{ .workloads.odf.storage_class | toJson }}
            {{- if eq .rgw_role "replica" }}
            - target:
                group: ceph.rook.io
                version: v1
                kind: CephObjectRealm
                name: hub-realm
              patch: |-
                - op: add
                  path: /spec/pull
                  value:
                    endpoint: {{ .workloads.odf.partner_endpoint | toJson }}
            {{- end }}

            - target:
                kind: ExternalSecret
                name: barman-rgw-credentials
              patch: |
                - op: replace
                  path: /spec/data/0/remoteRef/key
                  value: '{{ .workloads.eso.secret_prefix }}/hub-rgw-s3-credentials'
                - op: replace
                  path: /spec/data/1/remoteRef/key
                  value: '{{ .workloads.eso.secret_prefix }}/hub-rgw-s3-credentials'
            - target:
                kind: ExternalSecret
                name: hub-rgw-s3-credentials
              patch: |
                - op: replace
                  path: /spec/dataFrom/0/extract/key
                  value: '{{ .workloads.eso.secret_prefix }}/hub-rgw-s3-credentials'
            - target:
                kind: ExternalSecret
                name: hub-realm-keys
              patch: |
                - op: replace
                  path: /spec/dataFrom/0/extract/key
                  value: '{{ .workloads.eso.secret_prefix }}/hub-realm-keys'
  generators:
  - matrix:
      generators:
      - matrix:
          generators:
          - git:
              repoURL: https://github.com/ansible-automation-platform/aap-ha-dr-gitops/
              revision: main
              pathParamPrefix: pair
              files:
              - path: examples/aws-rosa-pair/deployment/argocd/pairs/*.yaml
          - list:
              elementsYaml: '[{{ range $i, $id := .member_environments }}{{ if $i }},{{ end }}{"environment_id":{{
                $id | toJson }}}{{ end }}]'
      - git:
          repoURL: https://github.com/ansible-automation-platform/aap-ha-dr-gitops/
          revision: main
          pathParamPrefix: environment
          files:
          - path: examples/aws-rosa-pair/deployment/argocd/environments/{{ .environment_id }}.yaml
    selector:
      matchLabels:
        target_cluster_id: example-b

