                name: aap
              patch: |-
                - op: replace
                  path: /spec/public_base_url
                  value: {{ .workloads.platform.public_base_url | toJson }}
                - op: replace
                  path: /spec/extra_settings
                  value:
                    - setting: CSRF_TRUSTED_ORIGINS
                      value:
                        - {{ .workloads.platform.public_base_url | toJson }}
                        - {{ .workloads.platform.route_url | toJson }}
  generators:
  - matrix:
      generators:
      - matrix:
          generators:
          - git:
              repoURL: https://github.com/ansible-automation-platform/aap-ha-dr-gitops/
              revision: main
              pathParamPrefix: pair
              files:
              - path: examples/aws-rosa-pair/deployment/argocd/pairs/*.yaml
          - list:
              elementsYaml: '[{{ range $i, $id := .member_environments }}{{ if $i }},{{ end }}{"environment_id":{{
                $id | toJson }}}{{ end }}]'
      - git:
          repoURL: https://github.com/ansible-automation-platform/aap-ha-dr-gitops/
          revision: main
          pathParamPrefix: environment
          files:
          - path: examples/aws-rosa-pair/deployment/argocd/environments/{{ .environment_id }}.yaml
    selector:
      matchLabels:
        target_cluster_id: example-b

---
