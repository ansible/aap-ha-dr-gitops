                value: '{{ .workloads.eso.secret_prefix }}/aap-controller-receptor-work-signing'
          - target:
              kind: ExternalSecret
              name: aap-eda-admin-password
            patch: |
              - op: replace
                path: /spec/dataFrom/0/extract/key
                value: '{{ .workloads.eso.secret_prefix }}/aap-eda-admin-password'
          - target:
              kind: ExternalSecret
              name: aap-eda-db-fields-encryption-secret
            patch: |
              - op: replace
                path: /spec/dataFrom/0/extract/key
                value: '{{ .workloads.eso.secret_prefix }}/aap-eda-db-fields-encryption-secret'
          - target:
              kind: ExternalSecret
              name: aap-hub-admin-password
            patch: |
              - op: replace
                path: /spec/dataFrom/0/extract/key
                value: '{{ .workloads.eso.secret_prefix }}/aap-hub-admin-password'
          - target:
              kind: ExternalSecret
              name: aap-hub-container-auth
            patch: |
              - op: replace
                path: /spec/dataFrom/0/extract/key
                value: '{{ .workloads.eso.secret_prefix }}/aap-hub-container-auth'
          - target:
              kind: ExternalSecret
              name: aap-controller-postgres-configuration
            patch: |
              - op: replace
                path: /spec/dataFrom/0/extract/key
                value: '{{ .workloads.eso.secret_prefix }}/aap-controller-postgres-configuration'
          - target:
              kind: ExternalSecret
              name: aap-gateway-postgres-configuration
            patch: |
              - op: replace
                path: /spec/dataFrom/0/extract/key
                value: '{{ .workloads.eso.secret_prefix }}/aap-gateway-postgres-configuration'
          - target:
              kind: ExternalSecret
