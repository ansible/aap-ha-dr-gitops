      - git:
          repoURL: https://github.com/ansible-automation-platform/aap-ha-dr-gitops/
          revision: main
          pathParamPrefix: environment
          files:
          - path: examples/aws-rosa-pair/deployment/argocd/environments/{{ .environment_id }}.yaml
