        kind: AnsibleAutomationPlatform
        jsonPointers:
        - /spec/database
      - group: '*'
        kind: '*'
        jsonPointers:
        - /status
  templatePatch: |
    spec:
      source:
        kustomize:
          patches:
            - target:
                group: aap.ansible.com
                version: v1alpha1
