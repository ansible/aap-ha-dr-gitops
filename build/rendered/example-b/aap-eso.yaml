apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: external-secrets-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: eso-irsa-repair
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: eso-irsa-repair
  namespace: external-secrets
rules:
- apiGroups:
  - ""
  resourceNames:
  - external-secrets
  resources:
  - serviceaccounts
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: eso-irsa-repair
  namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-irsa-repair
subjects:
- kind: ServiceAccount
  name: eso-irsa-repair
  namespace: external-secrets
---
apiVersion: v1
data:
  roleArn: arn:aws:iam::000000000000:role/example-eso-secrets-reader
kind: ConfigMap
metadata:
  name: eso-irsa-config
---
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: eso-irsa-annotation-repair
  namespace: external-secrets
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
          - command:
            - /bin/sh
            - -ec
            - |
              current="$(oc get serviceaccount external-secrets -n external-secrets -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}' 2>/dev/null || true)"
              if [ "$current" = "$ESO_ROLE_ARN" ]; then
                echo "ESO IRSA annotation is correct"
                exit 0
              fi
              echo "Restoring ESO IRSA annotation"
              oc annotate serviceaccount external-secrets -n external-secrets \
                "eks.amazonaws.com/role-arn=${ESO_ROLE_ARN}" --overwrite
            env:
            - name: ESO_ROLE_ARN
              value: arn:aws:iam::000000000000:role/example-eso-secrets-reader
            image: registry.redhat.io/openshift4/ose-cli:latest
            imagePullPolicy: IfNotPresent
            name: repair
          restartPolicy: OnFailure
          serviceAccountName: eso-irsa-repair
  schedule: 0 0,12 * * *
  successfulJobsHistoryLimit: 1
---
