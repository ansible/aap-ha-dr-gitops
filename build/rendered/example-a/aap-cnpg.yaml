apiVersion: v1
kind: Service
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/alias: "false"
    external-dns.alpha.kubernetes.io/hostname: postgres-repl.cluster-a.example.com
    external-dns.alpha.kubernetes.io/ttl: "30"
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "3600"
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
  labels:
    aap.redhat.com/external-dns: replication
  name: aap-postgres-replication
  namespace: aap
spec:
  ports:
  - name: postgres
    port: 5432
    protocol: TCP
    targetPort: 5432
  selector:
    cnpg.io/cluster: aap-postgres
    cnpg.io/instanceRole: primary
  type: LoadBalancer
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
  name: cnpg-replication-tls
  namespace: aap
spec:
  data:
  - remoteRef:
      key: example/aap/shared/cnpg-tls
      property: example-a-replication.crt
    secretKey: tls.crt
  - remoteRef:
      key: example/aap/shared/cnpg-tls
      property: example-a-replication.key
    secretKey: tls.key
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-cross-account-secret-store
  target:
    creationPolicy: Owner
    name: cnpg-replication-tls
    template:
      type: kubernetes.io/tls
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
  name: cnpg-server-tls
  namespace: aap
spec:
  data:
  - remoteRef:
      key: example/aap/shared/cnpg-tls
      property: example-a-server.crt
    secretKey: tls.crt
  - remoteRef:
      key: example/aap/shared/cnpg-tls
      property: example-a-server.key
    secretKey: tls.key
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-cross-account-secret-store
  target:
    creationPolicy: Owner
    name: cnpg-server-tls
    template:
      type: kubernetes.io/tls
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  name: cloudnative-pg
  namespace: aap
spec:
  channel: stable-v1
  installPlanApproval: Automatic
  name: cloudnative-pg
  source: certified-operators
  sourceNamespace: openshift-marketplace
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    cnpg.io/cluster: aap-postgres
  name: aap-postgres
  namespace: aap
spec:
  affinity:
    tolerations:
    - effect: NoSchedule
      key: dedicated
      value: postgres
    topologySpreadConstraints:
    - labelSelector:
        matchLabels:
          cnpg.io/cluster: aap-postgres
      maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
  backup:
    barmanObjectStore:
      data:
        compression: snappy
        immediateCheckpoint: true
        jobs: 8
      destinationPath: s3://cnpg-wal/example-a/
      endpointURL: http://rook-ceph-rgw-hub-objectstore.openshift-storage.svc:80
      s3Credentials:
        accessKeyId:
          key: ACCESS_KEY_ID
          name: barman-rgw-credentials
        secretAccessKey:
          key: ACCESS_SECRET_KEY
          name: barman-rgw-credentials
      wal:
        compression: gzip
        maxParallel: 8
    retentionPolicy: 2d
  bootstrap:
    initdb:
      dataChecksums: true
      database: postgres
      owner: postgres
      postInitApplicationSQL:
      - GRANT CONNECT ON DATABASE automationcontroller TO automationmetrics_controller;
      - GRANT pg_read_all_data TO automationmetrics_controller;
      - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO automationmetrics_controller;
      - GRANT pg_monitor TO monitoring;
      - GRANT pg_read_server_files TO monitoring;
      - GRANT CONNECT ON DATABASE automationgateway TO monitoring;
      - GRANT CONNECT ON DATABASE automationcontroller TO monitoring;
      - GRANT CONNECT ON DATABASE automationhub TO monitoring;
      - GRANT CONNECT ON DATABASE automationeda TO monitoring;
      postInitSQLRefs:
        secretRefs:
        - key: init.sql
          name: cnpg-init-sql
      postInitTemplateSQL:
      - CREATE DATABASE automationcontroller;
      - CREATE DATABASE automationhub;
      - CREATE DATABASE automationgateway;
      - CREATE DATABASE automationeda;
      - CREATE DATABASE automationmetrics;
      - GRANT ALL PRIVILEGES ON DATABASE automationcontroller TO automationcontroller;
      - GRANT ALL PRIVILEGES ON DATABASE automationhub TO automationhub;
      - GRANT ALL PRIVILEGES ON DATABASE automationgateway TO automationgateway;
      - GRANT ALL PRIVILEGES ON DATABASE automationeda TO automationeda;
      - GRANT ALL PRIVILEGES ON DATABASE automationmetrics TO automationmetrics;
      - ALTER DATABASE automationcontroller OWNER TO automationcontroller;
      - ALTER DATABASE automationhub OWNER TO automationhub;
      - ALTER DATABASE automationgateway OWNER TO automationgateway;
      - ALTER DATABASE automationeda OWNER TO automationeda;
      - ALTER DATABASE automationmetrics OWNER TO automationmetrics;
  certificates:
    clientCASecret: cnpg-ca
    replicationTLSSecret: cnpg-replication-tls
    serverCASecret: cnpg-ca
    serverTLSSecret: cnpg-server-tls
  enablePodAntiAffinity: true
  externalClusters:
  - barmanObjectStore:
      destinationPath: s3://cnpg-wal/example-a/
      endpointURL: http://rook-ceph-rgw-hub-objectstore.openshift-storage.svc:80
      s3Credentials:
        accessKeyId:
          key: ACCESS_KEY_ID
          name: barman-rgw-credentials
        secretAccessKey:
          key: ACCESS_SECRET_KEY
          name: barman-rgw-credentials
      wal:
        compression: gzip
        maxParallel: 8
    connectionParameters:
      dbname: postgres
      host: postgres-repl.cluster-a.example.com
      port: "5432"
      sslmode: verify-ca
      user: streaming_replica
    name: example-a
    sslCert:
      key: tls.crt
      name: cnpg-replication-tls
    sslKey:
      key: tls.key
      name: cnpg-replication-tls
    sslRootCert:
      key: ca.crt
      name: cnpg-ca
  - barmanObjectStore:
      destinationPath: s3://cnpg-wal/example-b/
      endpointURL: http://rook-ceph-rgw-hub-objectstore.openshift-storage.svc:80
      s3Credentials:
        accessKeyId:
          key: ACCESS_KEY_ID
          name: barman-rgw-credentials
        secretAccessKey:
          key: ACCESS_SECRET_KEY
          name: barman-rgw-credentials
      wal:
        compression: gzip
        maxParallel: 8
    connectionParameters:
      dbname: postgres
      host: postgres-repl.cluster-b.example.com
      port: "5432"
      sslmode: verify-ca
      user: streaming_replica
    name: example-b
    sslCert:
      key: tls.crt
      name: cnpg-replication-tls
    sslKey:
      key: tls.key
      name: cnpg-replication-tls
    sslRootCert:
      key: ca.crt
      name: cnpg-ca
  imageName: ghcr.io/cloudnative-pg/postgresql:15.10
  instances: 2
  monitoring:
    customQueriesConfigMap:
    - key: queries.yaml
      name: aap-postgres-monitoring
    defaultDatabase: postgres
    enablePodMonitor: true
  postgresql:
    parameters:
      archive_timeout: 30min
      autovacuum_analyze_scale_factor: "0.02"
      autovacuum_max_workers: "6"
      autovacuum_vacuum_cost_delay: 2ms
      autovacuum_vacuum_scale_factor: "0.02"
      checkpoint_completion_target: "0.9"
      effective_cache_size: 24GB
      effective_io_concurrency: "200"
      log_autovacuum_min_duration: "250"
      log_min_duration_statement: "1000"
      log_statement: ddl
      maintenance_work_mem: 2GB
      max_connections: "1024"
      max_wal_size: 8GB
      min_wal_size: 2GB
      pg_stat_statements.max: "5000"
      pg_stat_statements.track: top
      random_page_cost: "1.1"
      shared_buffers: 8GB
      tcp_keepalives_count: "3"
      tcp_keepalives_idle: "30"
      tcp_keepalives_interval: "10"
      wal_buffers: 32MB
      wal_level: replica
      work_mem: 128MB
    pg_hba:
    - host all all all scram-sha-256
  replica:
    primary: example-a
    self: example-a
    source: example-b
  resources:
    ephemeralVolumeSource:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 20Gi
    limits:
      cpu: "16"
      memory: 32Gi
    requests:
      cpu: "8"
      memory: 16Gi
  startDelay: 300
  stopDelay: 60
  storage:
    size: 2Ti
    storageClass: gp3-csi
  switchoverDelay: 60
  walStorage:
    size: 200Gi
    storageClass: gp3-csi
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: aap-postgres-scheduled
  namespace: aap
spec:
  backupOwnerReference: cluster
  cluster:
    name: aap-postgres
  method: barmanObjectStore
  schedule: 0 0 19 * * *
