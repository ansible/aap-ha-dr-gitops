      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: executionplane
    api:
      node_selector:
        dedicated: controlplane
      replicas: 2
      resource_requirements:
        requests:
          cpu: 500m
          memory: 4Gi
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: controlplane
    database:
      database_secret: aap-eda-postgres-configuration
      externally_managed: true
    default_worker:
      node_selector:
        dedicated: controlplane
      replicas: 2
      resource_requirements:
        requests:
          cpu: 500m
          memory: 4Gi
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: controlplane
    disabled: false
    event_stream:
      database_secret: aap-eda-event-stream-postgres-configuration
