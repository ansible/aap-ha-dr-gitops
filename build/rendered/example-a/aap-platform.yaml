        dedicated: controlplane
      replicas: 2
      resource_requirements:
        requests:
          cpu: 500m
          memory: 4Gi
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: controlplane
  extra_settings:
